pull_request_rules:
  - name: ba victim
    conditions:
      - title~=ba-victim
    actions:
      comment:
        message: "hunt-zero-relationship-20260815"
        bot_account: ironmossvictim
  - name: ba control
    conditions:
      - title~=ba-control
    actions:
      comment:
        message: "hunt-baseline-20260815"
  - name: ba update
    conditions:
      - title~=ba-update
    actions:
      update:
        bot_account: ironmossvictim
  - name: ba merge
    conditions:
      - title~=ba-merge
    actions:
      merge:
        merge_bot_account: ironmossvictim
  - name: h25 ctl
    conditions:
      - title~=^h25-probe
    actions:
      comment:
        message: "h25-ctl {{ number }}"
  - name: h25 t0
    conditions:
      - title~=^h25-probe
    actions:
      comment:
        message: "h25-t0 {{ '{0.__class__}'.format(1) }}"
  - name: h25 t1
    conditions:
      - title~=^h25-probe
    actions:
      comment:
        message: "h25-t1 {{ ('{0.__class__}'|attr('format'))(1) }}"
