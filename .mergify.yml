queue_rules:
  - name: main-guarded
    queue_conditions:
      - base = main
      - "#approved-reviews-by >= 1"
    merge_conditions:
      - "#approved-reviews-by >= 1"

  - name: side-open
    queue_conditions:
      - base != main
    merge_conditions: []

